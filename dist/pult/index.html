.btn.ok{background:var(--ok);color:var(--tile)}
.bento{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:14px}
.tile{background:var(--tile);border-radius:var(--r);padding:22px;display:grid;gap:10px;align-content:space-between;min-width:0;border:0;text-align:left}
.tile.sun{background:linear-gradient(140deg,var(--sun1),var(--sun2))}
.tile.lilac{background:linear-gradient(140deg,var(--lilac1),var(--lilac2))}
.tile.mint{background:linear-gradient(140deg,var(--mint1),var(--mint2))}
.big{font-weight:300;font-size:clamp(44px,6vw,68px);line-height:.9;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.big small{font-size:15px;letter-spacing:0;font-weight:400;margin-left:6px;color:var(--muted)}
.tile .note{font-size:13px;color:var(--fg);opacity:.75}
.dots{display:flex;flex-wrap:wrap;gap:5px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--fg);opacity:.85}
.tabs{display:flex;gap:6px;flex-wrap:wrap;background:var(--tile);border-radius:999px;padding:6px;width:max-content;max-width:100%}
.tabs button{border:0;background:none;border-radius:999px;padding:9px 16px;color:var(--muted);font-weight:500}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.tabs .n{opacity:.6;margin-left:4px;font-variant-numeric:tabular-nums}
.panel{background:var(--tile);border-radius:var(--r);padding:8px 22px 14px;min-width:0}
.group{display:grid;gap:0;padding-top:14px}
.group h3{margin:0 0 4px;font-size:13px;font-weight:500;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.row:first-of-type{border-top:0}
.who{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.who.zhenya{background:linear-gradient(140deg,var(--sun1),var(--sun2))}
.who.anna{background:linear-gradient(140deg,var(--lilac1),var(--lilac2))}
.who.done{background:linear-gradient(140deg,var(--mint1),var(--mint2))}
.row .t{font-weight:500;line-height:1.35}
.row .m{font-size:13px;color:var(--muted);margin-top:2px}
.age{font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;padding:5px 10px;border-radius:999px;background:var(--chip);color:var(--muted)}
.age.old{color:var(--warn);font-weight:500}
.empty{padding:28px 0;color:var(--muted)}
.projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pcard{background:var(--tile);border-radius:var(--r);padding:20px 22px;display:grid;gap:10px;align-content:start;min-width:0}
.pcard h3{margin:0;font-weight:500;font-size:18px}
.pcard p{margin:0;color:var(--muted);font-size:13.5px}
.bar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--chip)}
.bar span{display:block}
.bar .z{background:var(--sun2)} .bar .a{background:var(--lilac1)} .bar .d{background:var(--mint2)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.pcard .row{padding:10px 0}
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 10px 30px rgba(0,0,0,.18)}
/* нижнее окно */
.scrim{position:fixed;inset:0;background:rgba(20,18,16,.35);display:grid;align-items:end;justify-items:center;z-index:20}
.sheet{background:var(--tile);width:min(720px,100%);max-height:88vh;overflow:auto;border-radius:var(--r) var(--r) 0 0;padding:22px max(18px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
.sheet h2{margin:0;font-weight:500;font-size:22px;line-height:1.25}
.sheet .need{background:linear-gradient(140deg,var(--sun1),var(--sun2));border-radius:18px;padding:14px 16px}
.sheet .need.anna{background:linear-gradient(140deg,var(--lilac1),var(--lilac2))}
.sheet .need.done{background:linear-gradient(140deg,var(--mint1),var(--mint2))}
.sheet p{margin:0}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{color:var(--fg);background:var(--chip);border-radius:999px;padding:7px 14px;text-decoration:none;font-size:13.5px;word-break:break-all}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.notes{display:grid;gap:8px}
.notes .n{background:var(--chip);border-radius:16px;padding:10px 14px}
.notes .n b{font-weight:500;margin-right:6px}
.notes .n span{color:var(--muted);font-size:12px}
textarea,input,select{font:inherit;color:var(--fg);background:var(--chip);border:1px solid var(--line);border-radius:14px;padding:11px 14px;width:100%}
textarea{min-height:76px;resize:vertical}
.form{display:grid;gap:10px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.status{font-size:13px;color:var(--muted);text-align:center;padding:6px}
@media (max-width:860px){.bento{grid-template-columns:1fr 1fr}.bento .tile:first-child{grid-column:1/-1}}
@media (max-width:520px){.form .two{grid-template-columns:1fr}.row{grid-template-columns:auto minmax(0,1fr)}.row .age{grid-column:2;justify-self:start}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .25s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

<div class="wrap">
  <header>
    <div>
      <div class="lbl">Аня × Женя</div>
      <h1>Культкартин · общий пульт</h1>
      <p class="sub">Что сделано, что в работе и где нужен ответ Жени. Нажми на задачу, чтобы увидеть подробности, отметить «Сделала» или написать комментарий.</p>
    </div>
  </header>

  <section class="bento" aria-label="Сводка">
    <button class="tile sun" data-go="zhenya"><div class="lbl">Ждём от Жени</div><div class="big" id="sZ">—</div><div class="note" id="sZn">&nbsp;</div></button>
    <button class="tile lilac" data-go="anna"><div class="lbl">Делает Аня</div><div class="big" id="sA">—</div><div class="note" id="sAn">&nbsp;</div></button>
    <button class="tile mint" data-go="done"><div class="lbl">Сделано Аней</div><div class="big" id="sD">—</div><div class="note" id="sDn">&nbsp;</div></button>
    <div class="tile"><div class="lbl">Висит дольше недели</div><div class="big" id="sO">—</div><div class="dots" id="sOd" aria-hidden="true"></div></div>
  </section>

  <div class="tabs" role="tablist">
    <button role="tab" data-tab="zhenya" aria-selected="true">Ждём Женю<span class="n" id="nZ"></span></button>
    <button role="tab" data-tab="anna" aria-selected="false">У Ани<span class="n" id="nA"></span></button>
    <button role="tab" data-tab="done" aria-selected="false">Сделано<span class="n" id="nD"></span></button>
    <button role="tab" data-tab="projects" aria-selected="false">По проектам</button>
  </div>

  <main id="view"><div class="panel"><div class="empty">Загружаю задачи…</div></div></main>
  <div class="status" id="status"></div>
</div>

<button class="btn fab" id="addBtn" hidden>+ Задача</button>
<div class="scrim" id="scrim" hidden></div>

<script>
const $=s=>document.querySelector(s);
const WHO={zhenya:'Ж',anna:'А',done:'✓'};
const STATUS_LABEL={zhenya:'Ждём от Жени',anna:'Делает Аня',done:'Сделано'};
let db=null,user=null,isOwner=false,canWrite=false;
let projects=[],tasks=[],notes=[],tab='zhenya';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const days=d=>d?Math.max(0,Math.round((Date.now()-new Date(d+'T12:00:00'))/864e5)):0;
const ruDate=d=>d?new Date(d+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long'}):'';
const plural=(n,a,b,c)=>{const m=n%10,h=n%100;return m==1&&h!=11?a:m>=2&&m<=4&&(h<10||h>=20)?b:c};
const ageText=t=>{if(t.status==='done')return t.doneAt?ruDate(t.doneAt):'';const n=days(t.since);return n===0?'с сегодня':n+' '+plural(n,'день','дня','дней')};
const pname=id=>(projects.find(p=>p.id===id)||{}).title||'Без проекта';
const tsort=(a,b)=>a.status==='done'?String(b.doneAt||'').localeCompare(String(a.doneAt||'')):String(a.since||'').localeCompare(String(b.since||''));

function rowHTML(t,showProject=true){
  const old=t.status!=='done'&&days(t.since)>7;
  return `<button class="row" data-id="${esc(t.id)}"><span class="who ${t.status}" aria-label="${STATUS_LABEL[t.status]}">${WHO[t.status]}</span>
  <span><div class="t">${esc(t.title)}</div><div class="m">${showProject?esc(pname(t.project)):''}${t.status!=='done'&&t.need?(showProject?' · ':'')+esc(t.need).slice(0,90)+(t.need.length>90?'…':''):''}</div></span>
  <span class="age${old?' old':''}">${ageText(t)}</span></button>`;
}
function listByProject(list){
  if(!list.length)return '<div class="empty">Здесь пусто.</div>';
  const order=[...projects].sort((a,b)=>(a.order||0)-(b.order||0)).map(p=>p.id);
  const ids=[...new Set([...order,...list.map(t=>t.project)])].filter(id=>list.some(t=>t.project===id));
  return ids.map(id=>`<div class="group"><h3>${esc(pname(id))}</h3>${list.filter(t=>t.project===id).sort(tsort).map(t=>rowHTML(t,false)).join('')}</div>`).join('');
}
function render(){
  const by=s=>tasks.filter(t=>t.status===s);
  const Z=by('zhenya'),A=by('anna'),D=by('done');
  $('#sZ').textContent=Z.length;$('#sA').textContent=A.length;$('#sD').textContent=D.length;
  const oldest=Z.reduce((m,t)=>Math.max(m,days(t.since)),0);
  $('#sZn').textContent=Z.length?'самая давняя — '+oldest+' '+plural(oldest,'день','дня','дней'):'всё ответила';
  $('#sAn').textContent=A.length?'задачи в работе':'всё сделано';
  const week=D.filter(t=>days(t.doneAt)<=7).length;
  $('#sDn').textContent='за последнюю неделю — '+week;
  const O=tasks.filter(t=>t.status!=='done'&&days(t.since)>7);
  $('#sO').textContent=O.length;
  $('#sOd').innerHTML=O.map(()=>'<i></i>').join('');
  $('#nZ').textContent=Z.length;$('#nA').textContent=A.length;$('#nD').textContent=D.length;
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));
  const v=$('#view');
  if(tab==='projects'){
    v.innerHTML='<div class="projects">'+[...projects].sort((a,b)=>(a.order||0)-(b.order||0)).map(p=>{
      const L=tasks.filter(t=>t.project===p.id),z=L.filter(t=>t.status==='zhenya').length,a=L.filter(t=>t.status==='anna').length,d=L.filter(t=>t.status==='done').length,n=L.length||1;
      const open=L.filter(t=>t.status!=='done').sort(tsort);
      return `<article class="pcard"><h3>${esc(p.title)}</h3>${p.sub?`<p>${esc(p.sub)}</p>`:''}
      <div class="bar" aria-hidden="true"><span class="d" style="width:${d/n*100}%"></span><span class="a" style="width:${a/n*100}%"></span><span class="z" style="width:${z/n*100}%"></span></div>
      <div class="legend"><span>сделано ${d}</span><span>у Ани ${a}</span><span>ждём Женю ${z}</span></div>
      <div>${open.map(t=>rowHTML(t,false)).join('')||'<div class="m" style="color:var(--muted);font-size:13px">Открытых задач нет</div>'}</div></article>`}).join('')+'</div>';
  }else{
    const list=tab==='zhenya'?Z:tab==='anna'?A:D;
    v.innerHTML='<div class="panel">'+listByProject(list)+'</div>';
  }
}
function openTask(id){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  const my=notes.filter(n=>n.task===id).sort((a,b)=>String(a.ts).localeCompare(String(b.ts)));
  const links=(t.links||[]).map(l=>`<a href="${esc(l.u)}" target="_blank" rel="noopener">${esc(l.t||l.u)}</a>`).join('');
  const s=$('#scrim');
  s.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shT">
    <div class="lbl">${esc(pname(t.project))} · ${STATUS_LABEL[t.status]}${t.status!=='done'&&t.since?' · с '+ruDate(t.since):''}${t.status==='done'&&t.doneAt?' · '+ruDate(t.doneAt):''}</div>
    <h2 id="shT">${esc(t.title)}</h2>
    ${t.need?`<div class="need ${t.status}"><div class="lbl" style="color:inherit;opacity:.7">${t.status==='zhenya'?'Что нужно от Жени':t.status==='anna'?'Что делает Аня':'Что сделано'}</div><p>${esc(t.need)}</p></div>`:''}
    ${t.result?`<p>${esc(t.result)}</p>`:''}
    ${links?`<div class="links">${links}</div>`:''}
    ${canWrite?`<div class="actions">
      ${t.status==='zhenya'?'<button class="btn ok" data-act="done">Сделала ✓</button><button class="btn ghost" data-act="anna">Передать Ане</button>':''}
      ${t.status==='anna'?'<button class="btn ok" data-act="done">Готово ✓</button><button class="btn ghost" data-act="zhenya">Нужно от Жени</button>':''}
      ${t.status==='done'?'<button class="btn ghost" data-act="reopen">Вернуть в работу</button>':''}
      ${isOwner?'<button class="btn ghost" data-act="edit">Изменить</button>':''}
    </div>`:''}
    <div class="lbl">Комментарии</div>
    <div class="notes">${my.map(n=>`<div class="n"><b>${n.by==='anna'?'Аня':'Женя'}</b><span>${esc(new Date(n.ts).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}))}</span><div>${esc(n.text)}</div></div>`).join('')||'<div class="m" style="color:var(--muted);font-size:13px">Пока нет комментариев</div>'}</div>
    ${canWrite?`<form class="form" id="noteForm"><label class="lbl" for="noteText">Написать</label><textarea id="noteText" placeholder="Например: фото пришлю в пятницу"></textarea><div class="actions"><button class="btn" type="submit">Отправить</button><button class="btn ghost" type="button" data-act="close">Закрыть</button></div></form>`:'<div class="actions"><button class="btn ghost" data-act="close">Закрыть</button></div>'}
  </div>`;
  s.hidden=false;
  s.onclick=async e=>{
    if(e.target===s)return close();
    const a=e.target.closest('[data-act]');if(!a)return;
    const act=a.dataset.act;
    if(act==='close')return close();
    if(act==='edit')return editTask(t);
    const patch=act==='done'?{status:'done',doneAt:today()}:act==='reopen'?{status:'anna',since:today()}:{status:act,since:today()};
    a.disabled=true;
    try{await db.collection('tasks').doc(t.id).update(patch);close()}catch(err){a.disabled=false;$('#status').textContent='Не сохранилось: нет прав на изменение.'}
  };
  const f=$('#noteForm');
  if(f)f.onsubmit=async e=>{e.preventDefault();const text=$('#noteText').value.trim();if(!text)return;
    try{await db.collection('notes').add({task:t.id,text,by:isOwner?'anna':'zhenya',ts:new Date().toISOString()});openTask(t.id)}catch(err){$('#status').textContent='Комментарий не сохранился.'}};
}
function editTask(t){
  const isNew=!t;t=t||{status:'zhenya',project:(projects[0]||{}).id,since:today()};
  const s=$('#scrim');
  s.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><h2>${isNew?'Новая задача':'Изменить задачу'}</h2>
  <form class="form" id="edForm">
    <label class="lbl" for="fT">Задача</label><input id="fT" required value="${esc(t.title)}">
    <div class="two"><div><label class="lbl" for="fP">Проект</label><select id="fP">${projects.map(p=>`<option value="${esc(p.id)}"${p.id===t.project?' selected':''}>${esc(p.title)}</option>`).join('')}</select></div>
    <div><label class="lbl" for="fS">Статус</label><select id="fS">${Object.entries(STATUS_LABEL).map(([k,v])=>`<option value="${k}"${k===t.status?' selected':''}>${v}</option>`).join('')}</select></div></div>
    <label class="lbl" for="fN">Что нужно / что сделано</label><textarea id="fN">${esc(t.need)}</textarea>
    <div class="two"><div><label class="lbl" for="fD">С какого числа</label><input id="fD" type="date" value="${esc(t.since||today())}"></div>
    <div><label class="lbl" for="fL">Ссылка (необязательно)</label><input id="fL" value="${esc((t.links||[])[0]?.u||'')}"></div></div>
    <div class="actions"><button class="btn" type="submit">Сохранить</button><button class="btn ghost" type="button" id="edCancel">Отмена</button>${!isNew&&isOwner?'<button class="btn ghost" type="button" id="edDel">Удалить</button>':''}</div>
  </form></div>`;
  s.hidden=false;s.onclick=e=>{if(e.target===s)close()};
  $('#edCancel').onclick=close;
  if($('#edDel'))$('#edDel').onclick=async()=>{try{await db.collection('tasks').doc(t.id).delete();close()}catch(e){$('#status').textContent='Не удалилось.'}};
  $('#edForm').onsubmit=async e=>{e.preventDefault();
    const st=$('#fS').value,link=$('#fL').value.trim();
    const data={title:$('#fT').value.trim(),project:$('#fP').value,status:st,need:$('#fN').value.trim(),since:$('#fD').value||today()};
    if(link)data.links=[{t:'Ссылка',u:link}];
    if(st==='done'&&!t.doneAt)data.doneAt=today();
    try{isNew?await db.collection('tasks').add(data):await db.collection('tasks').doc(t.id).update(data);close()}catch(err){$('#status').textContent='Не сохранилось: нет прав на изменение.'}};
}
function close(){const s=$('#scrim');s.hidden=true;s.innerHTML=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#scrim').hidden)close()});
document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;try{localStorage.setItem('kk-tab',tab)}catch(_){}render()};
document.querySelector('.bento').onclick=e=>{const b=e.target.closest('[data-go]');if(!b)return;tab=b.dataset.go;render()};
$('#view').onclick=e=>{const r=e.target.closest('.row');if(r)openTask(r.dataset.id)};
$('#addBtn').onclick=()=>editTask(null);
try{const saved=localStorage.getItem('kk-tab');if(saved)tab=saved}catch(_){}

(async()=>{
  const timer=setTimeout(()=>{if(!tasks.length)$('#view').innerHTML='<div class="panel"><div class="empty">Не удалось загрузить задачи. Проверь, что ты вошла в аккаунт Claude, и обнови страницу.</div></div>'},10000);
  if(window.PULT_DATA){clearTimeout(timer);projects=PULT_DATA.projects;tasks=PULT_DATA.tasks;notes=PULT_DATA.notes;canWrite=false;document.querySelector('.sub').textContent='Что сделано, что в работе и где нужен ответ Жени. Обновлено '+PULT_DATA.updated+'. Нажми на задачу, чтобы увидеть подробности.';render();return}
  db=await claude.use('db');user=await claude.use('user');
  if(!db){clearTimeout(timer);$('#view').innerHTML='<div class="panel"><div class="empty">Чтобы видеть задачи, войди в аккаунт Claude и открой ссылку ещё раз.</div></div>';return}
  isOwner=user?await user.isOwner():false;
  const cw=user?await user.can('data.write'):null;canWrite=cw!==false;
  $('#addBtn').hidden=!canWrite;
  db.collection('projects').onSnapshot(s=>{projects=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{});
  db.collection('notes').onSnapshot(s=>{notes=s.docs.map(d=>({id:d.id,...d.data()}))},()=>{});
  db.collection('tasks').onSnapshot(s=>{clearTimeout(timer);tasks=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{clearTimeout(timer);$('#view').innerHTML='<div class="panel"><div class="empty">Нет доступа к задачам.</div></div>'});
})();
</script>
</body></html>
