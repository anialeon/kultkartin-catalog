<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Страница не найдена — КУЛЬТКАРТИН</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.png" type="image/png">
<script>
// Старые адреса сайта на LPmotor → разделы нового каталога (переезд на kultkartin.com, 2026-10)
(function(){
  var map={'/catalog':'/#catalog','/kartiny':'/#catalog','/illust':'/#catalog','/illustracii':'/#catalog','/nalichie':'/#catalog',
           '/about-us':'/#why','/contacts':'/#contacts','/dealers':'/#contacts','/consent':'/','/regulation':'/'};
  var path=location.pathname.replace(/\/+$/,'').toLowerCase()||'/';
  var target=map[path];
  if(!target&&/^\/(catalog|kartiny|illust|nalichie)\//.test(path))target='/#catalog';
  if(target){var h=target.indexOf('#');location.replace(h<0?target+location.search:target.slice(0,h)+location.search+target.slice(h))}
})();
</script>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fbf6ee;color:#161a17;font:400 16px/1.6 Manrope,Arial,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
h1{font:400 clamp(44px,8vw,80px)/1 'Cormorant Garamond',Georgia,serif;margin:0 0 16px}
p{color:#7a716b;margin:0 0 28px}
a{display:inline-block;background:#440512;color:#f7eddd;text-decoration:none;padding:15px 26px;font-size:13px;letter-spacing:.1em;text-transform:uppercase}
</style>
</head>

<a href="/">Перейти в каталог</a>
</main>
</body>
</html>
