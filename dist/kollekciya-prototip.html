<style>
:root{--bg:#fbf6ee;--paper:#f3ece2;--ink:#1d1a19;--muted:#7a716b;--line:#e3d3c0;--wine:#440512;--cream:#f7eddd;--serif:'Cormorant Garamond',Georgia,serif;--sans:Manrope,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--sans)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block}
.proto{background:var(--wine);color:var(--cream);font-size:12px;letter-spacing:.08em;text-transform:uppercase;text-align:center;padding:8px 16px}
.top{position:sticky;top:0;z-index:20;background:rgba(251,246,238,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:1320px;margin:auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.top img{height:34px;width:auto}
.top a{color:var(--muted);text-decoration:none;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.wrap{max-width:1320px;margin:auto;padding:0 24px}
h1{font:300 clamp(56px,9vw,120px)/.95 var(--serif);letter-spacing:-.01em;margin:56px 0 14px}
.lead{color:var(--muted);max-width:560px;font-size:16px}
.bar{position:sticky;top:63px;z-index:15;background:var(--bg);border-bottom:1px solid var(--line);margin-top:34px;padding:16px 0 14px;display:grid;grid-template-columns:1fr auto;gap:14px 28px;align-items:start}
.themes{display:flex;flex-wrap:wrap;gap:6px 22px}
.themes button{font:400 21px/1.2 var(--serif);color:var(--muted);padding:2px 0;transition:color .2s;white-space:nowrap}
.themes button sup{font:500 10px var(--sans);margin-left:2px;vertical-align:super}
.themes button.on{color:var(--ink);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:6px}
.themes button:hover{color:var(--ink)}
.tools{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.seg{display:flex;border:1px solid var(--line)}
.seg button{padding:8px 14px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px;transition:background .2s,color .2s}
.seg button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.3}
.seg button.on{background:var(--wine);color:var(--cream)}
.fmt{display:flex;gap:14px;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.fmt button{color:var(--muted)}.fmt button.on{color:var(--wine)}
/* типы работ */
.kinds{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 26px;padding-bottom:12px;border-bottom:1px solid #eee3d5;margin-bottom:2px}
.kinds button{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:4px 0;position:relative}
.kinds button sup{font-size:9px;margin-left:3px}
.kinds button.on{color:var(--wine)}
.kinds button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--wine)}
.count{font-size:13px;color:var(--muted);margin:22px 0 6px}
/* серии */
.theme{margin:34px 0 10px}
.theme h2{position:sticky;top:var(--stick,150px);z-index:5;background:var(--bg);font:400 38px/1.1 var(--serif);padding:10px 0 12px;border-bottom:1px solid var(--line)}
.theme h2 sup{font:500 11px var(--sans);color:var(--muted);margin-left:4px;vertical-align:super}
.row{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;padding:22px 0;border-bottom:1px solid #eee3d5}
.row-meta b{display:block;font:400 22px/1.15 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-meta span{font-size:13px;color:var(--muted)}
.strip{display:flex;gap:12px;overflow-x:auto;scrollbar-width:thin;padding-bottom:6px}
.strip button{flex:none;position:relative}
.strip img{height:170px;width:auto;transition:transform .4s cubic-bezier(.16,1,.3,1)}
.strip button:hover img{transform:translateY(-4px)}
/* сетка */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:34px 22px;margin-top:20px}
.tile{display:block;min-width:0}.tile .box{aspect-ratio:1/1;display:flex;align-items:flex-end;justify-content:center}.tile img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;transition:opacity .3s}
.tile:hover img{opacity:.88}
.tile b{display:block;font:400 19px/1.2 var(--serif);margin-top:12px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile span{display:block;font-size:12px;color:var(--muted);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* обзор */
.ov{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:32px;margin-top:20px}
.ov-sec{margin-bottom:34px}
.ov-sec h3{font:400 24px/1 var(--serif);margin:0 0 12px;display:flex;align-items:baseline;gap:8px}
.ov-sec h3 span{font:500 11px var(--sans);color:var(--muted)}
.mosaic{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px}
.mosaic button{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center}.mosaic img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;transition:transform .3s,opacity .3s}
.mosaic button:hover img{transform:scale(1.06);opacity:.9}
.index{position:sticky;top:170px;align-self:start;display:grid;gap:6px;font-size:13px}
.index a{color:var(--muted);text-decoration:none;display:flex;justify-content:space-between;border-bottom:1px solid #eee3d5;padding:4px 0}
.index a:hover{color:var(--wine)}
/* лайтбокс */
.lb{position:fixed;inset:0;z-index:50;background:rgba(20,14,13,.9);display:none;align-items:center;justify-content:center;padding:24px}
.lb.open{display:flex}
.lb-in{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:30px;max-width:1100px;width:100%;align-items:center;color:var(--cream)}
.lb img{max-height:82vh;max-width:100%;margin:auto;object-fit:contain}
.lb h4{font:300 40px/1.05 var(--serif);margin-bottom:8px}
.lb p{color:rgba(247,237,221,.7);font-size:14px;margin-bottom:22px}
.lb a{display:inline-block;border:1px solid rgba(247,237,221,.6);color:var(--cream);padding:13px 20px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;text-decoration:none}
.lb-nav{display:flex;gap:10px;margin-top:22px}
.lb-nav button,.lb-x{color:var(--cream);border:1px solid rgba(247,237,221,.35);width:44px;height:44px;font-size:20px}
.lb-x{position:absolute;top:18px;right:18px}
@media(max-width:850px){
.kinds{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 12px}
.kinds button{white-space:nowrap}
.wrap{padding:0 16px}.top-in{padding:12px 16px}.top img{height:28px}
h1{margin-top:34px}
.bar{grid-template-columns:1fr;top:57px}
.themes{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.themes button{font-size:19px}
.tools{flex-direction:row;justify-content:space-between;align-items:center}
.seg button span{display:none}
.theme h2{font-size:30px}
.row{grid-template-columns:1fr;gap:10px;padding:18px 0}
.strip img{height:130px}
.grid{grid-template-columns:repeat(2,1fr);gap:24px 12px}
.ov{grid-template-columns:1fr}.index{display:none}
.mosaic{grid-template-columns:repeat(5,1fr);gap:4px}
.lb-in{grid-template-columns:1fr;gap:14px;text-align:center}.lb img{max-height:58vh}.lb h4{font-size:30px}.lb-nav{justify-content:center}
}
</style>
</head>

": "Орхидеи на песочном", "f": "v", "img": "https://lh3.googleusercontent.com/d/1mQlZ9jyX_IimJqDSwxBFBp45TEeDABKL", "m": "Графика"}, {"id": 121, "n": "Орхидеи на песочном VI", "t": "Орхидеи", "s": "Орхидеи на песочном", "f": "v", "img": "https://lh3.googleusercontent.com/d/12cUNwqJi9DW0g-pmSVS9w6-i3d4tlVJP", "m": "Графика"}, {"id": 122, "n": "Орхидеи на песочном VII", "t": "Орхидеи", "s": "Орхидеи на песочном", "f": "v", "img": "https://lh3.googleusercontent.com/d/1VXgYA4vgxkcVcJhVi0LEfex33nk787De", "m": "Графика"}, {"id": 123, "n": "Орхидеи на песочном VIII", "t": "Орхидеи", "s": "Орхидеи на песочном", "f": "v", "img": "https://lh3.googleusercontent.com/d/1zmUPHjvj3wjoAJyJZp18UyOSACGmhD_Y", "m": "Графика"}, {"id": 124, "n": "Фаленопсис I", "t": "Орхидеи", "s": "Фаленопсис", "f": "v", "img": "https://lh3.googleusercontent.com/d/1VGfIY4qxqLdLuhkPzUrvNAJipjmGVLw0", "m": "Иллюстрация"}, {"id": 125, "n": "Фаленопсис II", "t": "Орхидеи", "s": "Фаленопсис", "f": "v", "img": "https://lh3.googleusercontent.com/d/1DItyyCb-xJzR2kzKb7_RrrhA4a9SN84Y", "m": "Иллюстрация"}, {"id": 126, "n": "Орхидея. Линия I", "t": "Орхидеи", "s": "Орхидея. Линия", "f": "v", "img": "https://lh3.googleusercontent.com/d/1FEM0B2PzMclZq3roa_R1MJts3pQenNAI", "m": "Графика"}, {"id": 127, "n": "Орхидея. Линия II", "t": "Орхидеи", "s": "Орхидея. Линия", "f": "v", "img": "https://lh3.googleusercontent.com/d/1M2sMkHaqeh7_1sR4CfJB_4-KE2bY8J9S", "m": "Графика"}, {"id": 128, "n": "Орхидея. Линия III", "t": "Орхидеи", "s": "Орхидея. Линия", "f": "v", "img": "https://lh3.googleusercontent.com/d/1D-5QPngCjhWBRhLWa6CcL88DqI_XWsVT", "m": "Графика"}, {"id": 129, "n": "Орхидея. Линия IV", "t": "Орхидеи", "s": "Орхидея. Линия", "f": "v", "img": "https://lh3.googleusercontent.com/d/1r6ood66y-h4IWc6ttYUqrHuyW8-TtyQk", "m": "Графика"}, {"id": 130, "n": "Травы в сепии IX", "t": "Растения", "s": "Травы в сепии", "f": "v", "img": "https://lh3.googleusercontent.com/d/1ga6kB2Af4HQeUg7B6xVKbIC1W9N3MChd", "m": "Иллюстрация"}, {"id": 131, "n": "Травы в сепии X", "t": "Растения", "s": "Травы в сепии", "f": "v", "img": "https://lh3.googleusercontent.com/d/1Tn49FIqEjWmP15tlERutUURipenRjmhv", "m": "Иллюстрация"}, {"id": 132, "n": "Травы в сепии XI", "t": "Растения", "s": "Травы в сепии", "f": "v", "img": "https://lh3.googleusercontent.com/d/1upYpOPLfrimsmZdZI-5H4oHD6Dm2Sr-Z", "m": "Иллюстрация"}, {"id": 133, "n": "Травы в сепии XII", "t": "Растения", "s": "Травы в сепии", "f": "v", "img": "https://lh3.googleusercontent.com/d/1gd35odR3aeAMlLVZnN6JlDD-K8srD9gH", "m": "Иллюстрация"}, {"id": 134, "n": "Веточка. Силуэт", "t": "Растения", "s": "Веточка", "f": "v", "img": "https://lh3.googleusercontent.com/d/164f2czwrw72C_5v31CP2ZCKKUc7RtT0S", "m": "Графика"}, {"id": 135, "n": "Папоротники I", "t": "Растения", "s": "Папоротники", "f": "s", "img": "https://lh3.googleusercontent.com/d/16wlgFvqivEVlc3xjt8txE5_pMveqIugH", "m": "Графика"}, {"id": 136, "n": "Папоротники II", "t": "Растения", "s": "Папоротники", "f": "s", "img": "https://lh3.googleusercontent.com/d/1I_G0emjFwG2qWVmn8mx-7M7QW2-QsKlw", "m": "Графика"}, {"id": 137, "n": "Абстракция. Коричневые мазки I", "t": "Абстракция", "s": "Абстракция. Коричневые мазки", "f": "s", "img": "https://lh3.googleusercontent.com/d/1cXU6zW3kKwgn__6Zbj9137QhI7S2Nuur", "m": "Абстракция"}, {"id": 138, "n": "Абстракция. Коричневые мазки II", "t": "Абстракция", "s": "Абстракция. Коричневые мазки", "f": "s", "img": "https://lh3.googleusercontent.com/d/1m7uGSrWCzWFXxA7wFuljTMiej66rzaOC", "m": "Абстракция"}, {"id": 139, "n": "Абстракция. Синий и охра", "t": "Абстракция", "s": "Абстракция", "f": "s", "img": "https://lh3.googleusercontent.com/d/1ThYvJE8R0Vk8-sdADVjcSOR03lQ1Ta8f", "m": "Абстракция"}, {"id": 140, "n": "Абстракция. Линии и акварель", "t": "Абстракция", "s": "Абстракция", "f": "s", "img": "https://lh3.googleusercontent.com/d/1g712LJ8l5MAX8nopbG-6c0WkCrDRNgWC", "m": "Абстракция"}];
const img=(w,s)=>w.img+'=w'+s+'-rw',plural=(n,a,b,c)=>n%10==1&&n%100!=11?a:n%10>=2&&n%10<=4&&(n%100<10||n%100>=20)?b:c;
let theme='',view='series',fmt='',kind='ill';
const KINDS=[['ill','Иллюстрации'],['paint','Живопись'],['abs','Абстракция'],['photo','Фотографии'],['','Все']];
const kindOf=w=>({'Иллюстрация':'ill','Графика':'ill','Живопись':'paint','Абстракция':'abs','Фотография':'photo'})[w.m]||'ill';
const inKind=w=>!kind||kindOf(w)===kind;
const byCount=list=>{const m=new Map();list.forEach(w=>m.set(w.t,(m.get(w.t)||0)+1));return[...m].sort((a,b)=>b[1]-a[1])};
let themes=byCount(DATA).map(x=>x[0]);
document.getElementById('lead').textContent=`Вся коллекция КУЛЬТКАРТИН: ${DATA.length} ${plural(DATA.length,'работа','работы','работ')} — иллюстрации, живопись, абстракция и фотографии. Выберите тип и тему или смотрите всё сразу.`;
const tEl=document.getElementById('themes');
const drawThemes=()=>{const base=DATA.filter(w=>inKind(w)&&(!fmt||w.f===fmt));themes=byCount(base).map(x=>x[0]);if(theme&&!themes.includes(theme))theme='';const counts=Object.fromEntries(byCount(base));const all=base.length;document.getElementById('kinds').innerHTML=KINDS.map(([k,l])=>`<button data-k="${k}" class="${k===kind?'on':''}">${l}<sup>${DATA.filter(w=>(!k||kindOf(w)===k)&&(!fmt||w.f===fmt)).length}</sup></button>`).join('');tEl.innerHTML=`<button data-t="" class="${theme?'':'on'}">Все<sup>${all}</sup></button>`+themes.map(t=>`<button data-t="${t}" class="${t===theme?'on':''}">${t}<sup>${counts[t]||0}</sup></button>`).join('')};
const list=()=>DATA.filter(w=>inKind(w)&&(!theme||w.t===theme)&&(!fmt||w.f===fmt));
let flat=[];
const thumb=(w,s)=>`<button data-id="${w.id}" aria-label="${w.n}"><img loading="lazy" decoding="async" src="${img(w,s)}" alt="${w.n}"></button>`;
function render(){
 const items=list();flat=items;const groups=byCount(items).map(([t])=>[t,items.filter(w=>w.t===t)]);
 document.getElementById('count').textContent=`${items.length} ${plural(items.length,'работа','работы','работ')}`;
 const v=document.getElementById('view');
 if(view==='series'){
  v.innerHTML=groups.map(([t,ws])=>{const ser=new Map();ws.forEach(w=>{if(!ser.has(w.s))ser.set(w.s,[]);ser.get(w.s).push(w)});const rows=[...ser].sort((a,b)=>b[1].length-a[1].length);
   return `<section class="theme"><h2>${t}<sup>${ws.length}</sup></h2>${rows.map(([s,sw])=>`<div class="row"><div class="row-meta"><b>${s}</b><span>${sw.length} ${plural(sw.length,'работа','работы','работ')}</span></div><div class="strip">${sw.map(w=>thumb(w,400)).join('')}</div></div>`).join('')}</section>`}).join('');
 }else if(view==='grid'){
  v.innerHTML=`<div class="grid">${items.map(w=>`<button class="tile" data-id="${w.id}"><span class="box"><img loading="lazy" decoding="async" src="${img(w,500)}" alt="${w.n}"></span><b>${w.n}</b><span>${w.t}</span></button>`).join('')}</div>`;
 }else{
  v.innerHTML=`<div class="ov"><div>${groups.map(([t,ws],i)=>`<section class="ov-sec" id="t${i}"><h3>${t}<span>${ws.length}</span></h3><div class="mosaic">${ws.map(w=>thumb(w,220)).join('')}</div></section>`).join('')}</div><nav class="index">${groups.map(([t,ws],i)=>`<a href="#t${i}">${t}<span>${ws.length}</span></a>`).join('')}</nav></div>`;
 }
 setStick();
}
/* заголовок темы прилипает сразу под шапкой и панелью фильтров (их закреплённая высота, а не текущее положение) */
function setStick(){const top=document.querySelector('.top').offsetHeight,bar=document.querySelector('.bar');document.querySelector('.bar').style.top=top+'px';document.documentElement.style.setProperty('--stick',(top+bar.offsetHeight)+'px')}
addEventListener('resize',setStick);
document.getElementById('kinds').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;kind=b.dataset.k;theme='';drawThemes();render()});
tEl.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;theme=b.dataset.t;drawThemes();render()});
document.getElementById('views').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;view=b.dataset.v;document.querySelectorAll('#views button').forEach(x=>x.classList.toggle('on',x===b));render()});
document.getElementById('fmt').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;fmt=b.dataset.f;document.querySelectorAll('#fmt button').forEach(x=>x.classList.toggle('on',x===b));drawThemes();render()});
/* лайтбокс: листаем внутри серии */
const lb=document.getElementById('lb');let cur=null;
const seriesOf=w=>DATA.filter(x=>x.s===w.s&&x.t===w.t);
function show(w){cur=w;const s=seriesOf(w),i=s.indexOf(w);document.getElementById('lbimg').src=img(w,1200);document.getElementById('lbt').textContent=w.n;document.getElementById('lbs').textContent=`${w.t} · серия «${w.s}» · ${i+1} из ${s.length}`;document.getElementById('lba').href=`kartiny/${w.id}.html`;lb.classList.add('open')}
const step=d=>{if(!cur)return;const s=seriesOf(cur);show(s[(s.indexOf(cur)+d+s.length)%s.length])};
document.getElementById('view').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(!b)return;show(DATA.find(w=>w.id==b.dataset.id))});
document.getElementById('lbx').onclick=()=>lb.classList.remove('open');
lb.addEventListener('click',e=>{if(e.target===lb)lb.classList.remove('open')});
document.getElementById('lbp').onclick=()=>step(-1);document.getElementById('lbn').onclick=()=>step(1);
addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;if(e.key==='Escape')lb.classList.remove('open');if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1)});
let x0=null;lb.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});lb.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>40)step(dx<0?1:-1)},{passive:true});
drawThemes();render();
</script>
</body>
